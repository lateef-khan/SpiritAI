# Self-hosted Chatwoot for local development. Settings come from chatwoot/.env; `just env`
# makes it from .env.example. With DATABASE_URL empty, `just up` also starts the throwaway
# postgres below. Nothing local survives `just down`.

name: spirit-chatwoot

x-chatwoot: &chatwoot
  build: .
  image: spirit-chatwoot:local
  env_file: .env
  environment:
    NODE_ENV: production
    RAILS_ENV: production
    INSTALLATION_ENV: docker
    # Tables go in the chatwoot schema, not public, so Chatwoot can share a database.
    DATABASE_URL: ${DATABASE_URL:-postgres://chatwoot:chatwoot@postgres:5432/chatwoot?schema_search_path=chatwoot,public}
  volumes:
    - storage:/app/storage
  # Lets webhooks reach Spirit running on the host in local dev.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
      required: false
    redis:
      condition: service_healthy

services:
  # Creates or migrates the schema, then exits. Web and worker wait for it.
  migrate:
    <<: *chatwoot
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    restart: "no"

  web:
    <<: *chatwoot
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "127.0.0.1:${CHATWOOT_PORT:-53000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *chatwoot
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Only when DATABASE_URL is empty. pgvector, because Chatwoot's migrations create the
  # vector extension. The init script makes the chatwoot schema, as you must do by hand on Neon.
  postgres:
    image: pgvector/pgvector:pg16
    profiles: [localdb]
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: chatwoot
    volumes:
      - ./local-db.sql:/docker-entrypoint-initdb.d/local-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Memory only: job queues and presence. A restart drops jobs still waiting in the queue.
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  # Catches every email Chatwoot sends (invites, password resets). Inbox at the MAILPIT_PORT.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-58025}:8025"
    restart: unless-stopped

# Shared by web and worker, so it must be a volume. `just down` deletes it.
volumes:
  storage:
