# Self-hosted Chatwoot for local development. Every setting and secret comes from
# .secrets.env, which each recipe writes from the CHATWOOT_* keys in secrets/<env>.env. A setting
# with a local default is written ${NAME:-default} below, so a near-empty dev.env works. The
# database is Chatwoot's own on the shared server in postgres/, which `just up` starts.

name: spirit-chatwoot

x-chatwoot: &chatwoot
  build: .
  image: spirit-chatwoot:local
  env_file:
    - .secrets.env
  environment:
    NODE_ENV: production
    RAILS_ENV: production
    INSTALLATION_ENV: docker
    PRESENCE_DURATION: "60"
    # The same default as postgres/justfile.
    DATABASE_URL: ${DATABASE_URL:-postgres://chatwoot:chatwoot@postgres:5432/chatwoot}
    FRONTEND_URL: ${FRONTEND_URL:-http://desk.spirit.localhost:53000}
    FORCE_SSL: ${FORCE_SSL:-false}
    # initializers/spirit_hub.rb: the Hub's origin, and where a signed-out visit to /app/login goes.
    SPIRIT_HUB_ORIGIN: ${SPIRIT_HUB_ORIGIN:-http://hub.spirit.localhost:5299}
    SPIRIT_HUB_LOGIN_URL: ${SPIRIT_HUB_LOGIN_URL:-http://hub.spirit.localhost:5299/chat/login.html?app=desk}
    # Chatwoot's own setting: where it sends a visitor after they sign out of the dashboard.
    LOGOUT_REDIRECT_LINK: ${LOGOUT_REDIRECT_LINK:-http://hub.spirit.localhost:5299/chat/login.html?app=desk}
    ENABLE_ACCOUNT_SIGNUP: ${ENABLE_ACCOUNT_SIGNUP:-false}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    MAILER_SENDER_EMAIL: ${MAILER_SENDER_EMAIL:-Spirit <support@localhost>}
    SMTP_ADDRESS: ${SMTP_ADDRESS:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
    SMTP_DOMAIN: ${SMTP_DOMAIN:-localhost}
    SMTP_ENABLE_STARTTLS_AUTO: ${SMTP_ENABLE_STARTTLS_AUTO:-false}
    ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-local}
    SAFE_FETCH_ALLOW_PRIVATE_NETWORK: ${SAFE_FETCH_ALLOW_PRIVATE_NETWORK:-false}
    RAILS_LOG_TO_STDOUT: ${RAILS_LOG_TO_STDOUT:-true}
    LOG_LEVEL: ${LOG_LEVEL:-info}
  volumes:
    - storage:/app/storage
  # db reaches the shared server as postgres:5432. default keeps redis in reach.
  networks:
    default:
    db:
  # Lets webhooks reach Spirit running on the host in local dev.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    redis:
      condition: service_healthy

services:
  # Creates or migrates the schema, then exits. Web and worker wait for it.
  migrate:
    <<: *chatwoot
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    restart: "no"

  web:
    <<: *chatwoot
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "127.0.0.1:${HOST_PORT:-53000}:3000"
    # The tunnel reaches web on the shared network as http://chatwoot:3000.
    networks:
      default:
      db:
      edge:
        aliases: [chatwoot]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *chatwoot
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Memory only: job queues and presence. A restart drops jobs still waiting in the queue.
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  # Catches every email Chatwoot sends (invites, password resets). Inbox at the MAILPIT_PORT (CHATWOOT_MAILPIT_PORT in secrets/dev.env).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-58025}:8025"
    restart: unless-stopped

# Shared by web and worker, so it must be a volume. `just down` deletes it.
volumes:
  storage:

# Shared by every app and the tunnel. The justfile creates it; no `down` deletes it.
networks:
  edge:
    external: true
    name: spirit-edge
  # Made by `just postgres up` or `prod-up`.
  db:
    external: true
    name: spirit-db
