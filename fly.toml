app = "spiritai"
primary_region = "iad"


[build]
[build.args]
VITE_NEON_AUTH_URL = "https://ep-late-violet-axh7nydj.neonauth.c-4.us-east-2.aws.neon.tech/neondb/auth"

[env]
ASPNETCORE_HTTP_PORTS = "8080"

# Required.
AgentCore__ConfigurationPath = "config/spirit.yaml"

Auth__Neon__BaseUrl = "https://ep-late-violet-axh7nydj.neonauth.c-4.us-east-2.aws.neon.tech/neondb/auth"

ProxyHeaders__Enabled = "true"

Widget__AllowedOrigins__0 = "https://www.spiritfitness.com"


# The public name, not spiritai.fly.dev. chat. must answer on Fly before this deploys: GoTo checks
# the address when the channel is made.
Goto__WebhookBaseUrl = "https://chat.spiritfitnessapps.com"
Goto__ChannelNickname = "spirit-prod"
CallLog__Enabled = "true"

# Log levels live in src/SpiritAI/appsettings.json. docker-entrypoint.sh runs under /bin/sh, which
# drops an env var with a dot in its name, so Logging__LogLevel__System.Net.Http.HttpClient never
# reaches the app.

# The Hub (docs/superpowers/specs/2026-09-27-hub-single-sign-in-design.md). Hub__CrmUrl's origin
# must equal TWENTY_SERVER_URL in secrets/prod.env, and TWENTY_SPIRIT_HUB_ORIGIN must be https://<Hub__Host>.
# Twenty__BaseUrl, Twenty__HubSecret and the Chatwoot Platform keys are Fly secrets.
Hub__Host = "hub.spiritfitnessapps.com"
Hub__DeskUrl = "https://desk.spiritfitnessapps.com"
Hub__CrmUrl = "https://crm.spiritfitnessapps.com"

[http_service]
internal_port = 8080
force_https = true

# The cron in.github/workflows/machine-schedule.yml starts the Machine at 12:00 UTC and stops it at 02:00 UTC.
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
method = "GET"
path = "/health"
interval = "15s"
timeout = "5s"
grace_period = "45s"

[[vm]]
size = "shared-cpu-2x"
memory = "2gb"
