# Self-hosted Twenty CRM for local development. Settings come from twenty/.env; `just env`
# makes it from .env.example. With PG_DATABASE_URL empty, `just up` also starts the throwaway
# postgres below. Nothing local survives `just down`.

name: spirit-twenty

x-twenty: &twenty
  image: twentycrm/twenty:v2.41.0
  env_file: .env
  environment: &twenty-env
    NODE_PORT: "3000"
    PG_DATABASE_URL: ${PG_DATABASE_URL:-postgres://twenty:twenty@postgres:5432/twenty}
    REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in twenty/.env}@redis:6379
  volumes:
    - storage:/app/packages/twenty-server/.local-storage
  depends_on: &twenty-deps
    postgres:
      condition: service_healthy
      required: false
    redis:
      condition: service_healthy

services:
  # On start, the entrypoint creates or upgrades the schema and registers the cron jobs.
  server:
    <<: *twenty
    ports:
      - "127.0.0.1:${TWENTY_PORT:-53001}:3000"
    # The tunnel reaches the server on the shared network as http://twenty:3000.
    networks:
      default:
      edge:
        aliases: [twenty]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      # The first start builds the whole schema, which takes minutes.
      start_period: 1800s
    restart: unless-stopped

  worker:
    <<: *twenty
    command: ["yarn", "worker:prod"]
    environment:
      <<: *twenty-env
      # The server already migrates and registers the cron jobs.
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    depends_on:
      <<: *twenty-deps
      server:
        condition: service_healthy
    restart: unless-stopped

  # Only when PG_DATABASE_URL is empty. Twenty makes its own schemas (core, workspace_*).
  postgres:
    image: postgres:16
    profiles: [localdb]
    environment:
      POSTGRES_DB: twenty
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: twenty
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Memory only: cache and job queues. Queues need noeviction, or redis drops jobs when full.
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no --maxmemory-policy noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 2s
      retries: 30
    restart: unless-stopped

# Shared by server and worker, so it must be a volume. `just down` deletes it.
volumes:
  storage:

# Shared by every app and the tunnel. The justfile creates it; no `down` deletes it.
networks:
  edge:
    external: true
    name: spirit-edge
