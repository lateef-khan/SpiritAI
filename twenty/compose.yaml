# Self-hosted Twenty CRM for local development. Every setting and secret comes from .secrets.env,
# which each recipe writes from the TWENTY_* keys in secrets/<env>.env. A setting with a local
# default is written ${NAME:-default} below, so a near-empty dev.env works. The database is
# Twenty's own on the shared server in postgres/, which `just up` starts. Nothing local survives
# `just down`.
#
# The image is our fork's build from ghcr.io (see `just release`). compose.source.yaml builds it
# from twenty/source instead, for `just up source`.

name: spirit-twenty

x-twenty: &twenty
  image: ghcr.io/lateef-khan/twenty:v2.41.0-spirit.3
  env_file:
    - .secrets.env
  environment: &twenty-env
    # Locally the server listens on the host port too, so SERVER_URL works inside the containers (see
    # the alias below). compose.prod.yaml sets 3000 for the tunnel.
    NODE_PORT: "53001"
    # crm.spirit.localhost, not localhost: the Hub frames the CRM, and the session cookie reaches the
    # frame only when the Hub and the CRM are the same site (both under spirit.localhost).
    SERVER_URL: ${SERVER_URL:-http://crm.spirit.localhost:53001}
    EMAIL_DRIVER: ${EMAIL_DRIVER:-LOGGER}
    EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Spirit CRM}
    EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-crm@localhost}
    STORAGE_TYPE: ${STORAGE_TYPE:-LOCAL}
    TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
    # LOCAL runs the logic functions of our apps (twenty/apps/) in child processes of the server
    # and worker. Twenty turns them off outside its own development mode.
    LOGIC_FUNCTION_TYPE: ${LOGIC_FUNCTION_TYPE:-LOCAL}
    # Owner row access (see apps/row-access). The server and the worker both read it. Turn it on
    # only after the app is installed and its config is saved, then restart both.
    SPIRIT_ROW_ACCESS_ENFORCED: ${SPIRIT_ROW_ACCESS_ENFORCED:-false}
    # The Spirit Hub (the fork's spirit-hub module).
    SPIRIT_HUB_ORIGIN: ${SPIRIT_HUB_ORIGIN:-http://hub.spirit.localhost:5299}
    SPIRIT_HUB_LOGIN_URL: ${SPIRIT_HUB_LOGIN_URL:-http://hub.spirit.localhost:5299/chat/login.html?app=crm}
    # The same default as postgres/justfile.
    PG_DATABASE_URL: ${PG_DATABASE_URL:-postgres://twenty:twenty@postgres:5432/twenty}
    REDIS_URL: redis://:${REDIS_PASSWORD:?TWENTY_REDIS_PASSWORD must be set in secrets/<env>.env}@redis:6379
  volumes:
    - storage:/app/packages/twenty-server/.local-storage
  # db reaches the shared server as postgres:5432. default keeps redis in reach.
  networks:
    default:
    db:
  depends_on: &twenty-deps
    redis:
      condition: service_healthy

services:
  # On start, the entrypoint creates or upgrades the schema and registers the cron jobs.
  server:
    <<: *twenty
    ports:
      - "127.0.0.1:${HOST_PORT:-53001}:53001"
    # The tunnel reaches the server on the shared network as http://twenty:3000.
    # Logic functions call SERVER_URL from inside the server and worker containers: the alias makes
    # its host name reach this server, and NODE_PORT makes its port match.
    networks:
      default:
        aliases: [crm.spirit.localhost]
      db:
      edge:
        aliases: [twenty]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:$$NODE_PORT/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      # The first start builds the whole schema, which takes minutes.
      start_period: 1800s
    restart: unless-stopped

  worker:
    <<: *twenty
    command: ["yarn", "worker:prod"]
    environment:
      <<: *twenty-env
      # The server already migrates and registers the cron jobs.
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    depends_on:
      <<: *twenty-deps
      server:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Memory only: cache and job queues. Queues need noeviction, or redis drops jobs when full.
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no --maxmemory-policy noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 2s
      retries: 30
    restart: unless-stopped

# Shared by server and worker, so it must be a volume. `just down` deletes it.
volumes:
  storage:

# Shared by every app and the tunnel. The justfile creates it; no `down` deletes it.
networks:
  edge:
    external: true
    name: spirit-edge
  # Made by `just postgres up` or `prod-up`.
  db:
    external: true
    name: spirit-db
