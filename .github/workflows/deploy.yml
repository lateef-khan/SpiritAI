name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/web
        run: npm ci

      - name: Frontend build
        working-directory: src/web
        run: npm run build

      - name: Backend build (NuGet package mode)
        run: >
          dotnet build tests/SpiritAI.Tests/SpiritAI.Tests.csproj
          -p:UseLocalAgentCore=false
          -p:SkipClientAppBuild=true
          --nologo

  test:
    name: Test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/web
        run: npm ci

      - name: Frontend format check
        working-directory: src/web
        run: npm run format:check
      - name: Frontend OpenUI skill freshness
        working-directory: src/web
        run: npm run gen:openui:check

      - name: Frontend lint
        working-directory: src/web
        run: npm run lint

      - name: Frontend tests
        working-directory: src/web
        run: npm run test

      - name: Backend tests (NuGet package mode)
        run: >
          dotnet test tests/SpiritAI.Tests/SpiritAI.Tests.csproj
          -p:UseLocalAgentCore=false
          -p:SkipClientAppBuild=true
          --nologo

  # Creates the Fly app if it is missing and stages the app's secrets. Running
  # it on every deploy makes the whole thing idempotent: there is no separate
  # first-time setup to remember, and a rotated key only has to change in one
  # place (GitHub secrets).
  bootstrap:
    name: Fly app & secrets
    needs: build
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/sync-fly-secrets.yml
    secrets: inherit

  deploy:
    name: Deploy to Fly.io
    needs: bootstrap
    # Never from a pull request: a fork PR would otherwise reach the deploy token.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
