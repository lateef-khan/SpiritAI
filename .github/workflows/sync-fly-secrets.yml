name: Sync Fly secrets

# Manual only. fly.toml cannot declare required secrets the way a Render
# blueprint can, so this workflow is the CI equivalent of deploy-setup.sh:
# it copies GitHub repository secrets into the Fly secret store.
#
# Run it once before the first deploy, and again whenever a key is rotated.
# Everything else lives in fly.toml [env] and needs no secret at all.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  sync:
    name: Copy GitHub secrets into Fly
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check every required secret is present
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CUSTSERVICE_SQL_PASSWORD: ${{ secrets.CUSTSERVICE_SQL_PASSWORD }}
          GRAFANA_CLOUD_INSTANCE_ID: ${{ secrets.GRAFANA_CLOUD_INSTANCE_ID }}
          GRAFANA_CLOUD_API_TOKEN: ${{ secrets.GRAFANA_CLOUD_API_TOKEN }}
          CHATWOOT_BASE_URL: ${{ secrets.CHATWOOT_BASE_URL }}
          CHATWOOT_ACCOUNT_ID: ${{ secrets.CHATWOOT_ACCOUNT_ID }}
          CHATWOOT_INBOX_IDENTIFIER: ${{ secrets.CHATWOOT_INBOX_IDENTIFIER }}
          CHATWOOT_BOT_TOKEN: ${{ secrets.CHATWOOT_BOT_TOKEN }}
          CHATWOOT_SERVICE_TOKEN: ${{ secrets.CHATWOOT_SERVICE_TOKEN }}
          CHATWOOT_PLATFORM_TOKEN: ${{ secrets.CHATWOOT_PLATFORM_TOKEN }}
          CHATWOOT_APP_ADMIN_TOKEN: ${{ secrets.CHATWOOT_APP_ADMIN_TOKEN }}
          CHATWOOT_INBOX_ID: ${{ secrets.CHATWOOT_INBOX_ID }}
          TWENTY_BASE_URL: ${{ secrets.TWENTY_BASE_URL }}
          TWENTY_HUB_SECRET: ${{ secrets.TWENTY_HUB_SECRET }}
          GOTO_CLIENT_ID: ${{ secrets.GOTO_CLIENT_ID }}
          GOTO_CLIENT_SECRET: ${{ secrets.GOTO_CLIENT_SECRET }}
          GOTO_PERSONAL_ACCESS_TOKEN: ${{ secrets.GOTO_PERSONAL_ACCESS_TOKEN }}
          GOTO_ACCOUNT_KEY: ${{ secrets.GOTO_ACCOUNT_KEY }}
          GOTO_WEBHOOK_SECRET: ${{ secrets.GOTO_WEBHOOK_SECRET }}
        run: |
          missing=0

          for name in OPENAI_API_KEY OPENCODE_GO_API_KEY QDRANT_API_KEY TS_AUTHKEY POSTGRES_CONNECTION_STRING AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY CUSTSERVICE_SQL_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set"
              missing=1
            fi
          done

          # Catch the single most common Tailscale mistake before it becomes a
          # crash-looping Machine: an API token instead of an auth key.
          case "$TS_AUTHKEY" in
            tskey-auth-*|"") ;;
            *) echo "::error::TS_AUTHKEY must start with 'tskey-auth-'. A 'tskey-api-' token is a different thing."; missing=1 ;;
          esac

          # Grafana is OPTIONAL, but the two halves are optional TOGETHER: naming
          # the instance id makes the token required, and a half-configured pair
          # stops the host at startup.
          if [ -n "$GRAFANA_CLOUD_INSTANCE_ID" ] && [ -z "$GRAFANA_CLOUD_API_TOKEN" ]; then
            echo "::error::GRAFANA_CLOUD_INSTANCE_ID is set but GRAFANA_CLOUD_API_TOKEN is not. Set both or neither."
            missing=1
          fi
          if [ -z "$GRAFANA_CLOUD_INSTANCE_ID" ]; then
            echo "::notice::Grafana Cloud not configured - telemetry export is off. That is fine."
          fi

          # The widget and the Chatwoot turn need all four: the turn switches itself off, silently,
          # when one is missing.
          turn_set=0
          for name in CHATWOOT_BASE_URL CHATWOOT_ACCOUNT_ID CHATWOOT_INBOX_IDENTIFIER CHATWOOT_BOT_TOKEN; do
            if [ -n "${!name}" ]; then turn_set=$((turn_set + 1)); fi
          done
          if [ "$turn_set" -eq 0 ]; then
            echo "::notice::Chatwoot turn secrets are not set - the widget and human handoff are off."
          elif [ "$turn_set" -lt 4 ]; then
            echo "::error::Only $turn_set of CHATWOOT_BASE_URL, CHATWOOT_ACCOUNT_ID, CHATWOOT_INBOX_IDENTIFIER, CHATWOOT_BOT_TOKEN are set. Set all four or none."
            missing=1
          fi
          if [ -z "$CHATWOOT_SERVICE_TOKEN" ]; then
            echo "::notice::CHATWOOT_SERVICE_TOKEN is not set - Spirit cannot list teams or find calls."
          fi

          # The Hub's Desk and CRM halves are OPTIONAL, each all or nothing: Desk
          # needs all three Chatwoot keys, CRM needs the fork's address and secret.
          desk_set=0
          for name in CHATWOOT_PLATFORM_TOKEN CHATWOOT_APP_ADMIN_TOKEN CHATWOOT_INBOX_ID; do
            if [ -n "${!name}" ]; then desk_set=$((desk_set + 1)); fi
          done
          if [ "$desk_set" -eq 0 ]; then
            echo "::notice::Hub Desk secrets are not set - Create under Desk will fail."
          elif [ "$desk_set" -lt 3 ]; then
            echo "::error::Only $desk_set of CHATWOOT_PLATFORM_TOKEN, CHATWOOT_APP_ADMIN_TOKEN, CHATWOOT_INBOX_ID are set. Set all three or none."
            missing=1
          fi
          if { [ -n "$TWENTY_BASE_URL" ] && [ -z "$TWENTY_HUB_SECRET" ]; } || { [ -z "$TWENTY_BASE_URL" ] && [ -n "$TWENTY_HUB_SECRET" ]; }; then
            echo "::error::TWENTY_BASE_URL and TWENTY_HUB_SECRET go together. Set both or neither."
            missing=1
          elif [ -z "$TWENTY_BASE_URL" ]; then
            echo "::notice::Hub CRM secrets are not set - Create under CRM answers 'CRM is not set up yet.'."
          fi

          # GoTo ring alerts are OPTIONAL, but all five go together: the channel
          # job needs the token keys, the account, and the webhook secret.
          goto_set=0
          for name in GOTO_CLIENT_ID GOTO_CLIENT_SECRET GOTO_PERSONAL_ACCESS_TOKEN GOTO_ACCOUNT_KEY GOTO_WEBHOOK_SECRET; do
            if [ -n "${!name}" ]; then goto_set=$((goto_set + 1)); fi
          done
          if [ "$goto_set" -eq 0 ]; then
            echo "::notice::GoTo secrets are not set - ring alerts are off. That is fine."
          elif [ "$goto_set" -lt 5 ]; then
            echo "::error::Only $goto_set of the 5 GOTO_* secrets are set. Set all five or none."
            missing=1
          fi
          exit $missing

      # Creating the app here, and not through the Fly dashboard's "Launch from
      # GitHub" flow, is deliberate: that flow generates its own fly.toml,
      # Dockerfile and deploy workflow, all of which would fight the ones in this
      # repo and none of which know about Tailscale. This just makes an empty app
      # for our own fly.toml to deploy into.
      - name: Create the Fly app if it does not exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app="$(grep -m1 '^app *=' fly.toml | sed 's/.*= *"\(.*\)"/\1/')"
          echo "App: $app"
          if flyctl status --app "$app" >/dev/null 2>&1; then
            echo "Already exists."
          else
            flyctl apps create "$app" --org "${FLY_ORG:-personal}"
            echo "Created."
          fi

      - name: Stage secrets on Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CUSTSERVICE_SQL_PASSWORD: ${{ secrets.CUSTSERVICE_SQL_PASSWORD }}
          GRAFANA_CLOUD_INSTANCE_ID: ${{ secrets.GRAFANA_CLOUD_INSTANCE_ID }}
          GRAFANA_CLOUD_API_TOKEN: ${{ secrets.GRAFANA_CLOUD_API_TOKEN }}
          CHATWOOT_BASE_URL: ${{ secrets.CHATWOOT_BASE_URL }}
          CHATWOOT_ACCOUNT_ID: ${{ secrets.CHATWOOT_ACCOUNT_ID }}
          CHATWOOT_INBOX_IDENTIFIER: ${{ secrets.CHATWOOT_INBOX_IDENTIFIER }}
          CHATWOOT_BOT_TOKEN: ${{ secrets.CHATWOOT_BOT_TOKEN }}
          CHATWOOT_SERVICE_TOKEN: ${{ secrets.CHATWOOT_SERVICE_TOKEN }}
          CHATWOOT_PLATFORM_TOKEN: ${{ secrets.CHATWOOT_PLATFORM_TOKEN }}
          CHATWOOT_APP_ADMIN_TOKEN: ${{ secrets.CHATWOOT_APP_ADMIN_TOKEN }}
          CHATWOOT_INBOX_ID: ${{ secrets.CHATWOOT_INBOX_ID }}
          TWENTY_BASE_URL: ${{ secrets.TWENTY_BASE_URL }}
          TWENTY_HUB_SECRET: ${{ secrets.TWENTY_HUB_SECRET }}
          GOTO_CLIENT_ID: ${{ secrets.GOTO_CLIENT_ID }}
          GOTO_CLIENT_SECRET: ${{ secrets.GOTO_CLIENT_SECRET }}
          GOTO_PERSONAL_ACCESS_TOKEN: ${{ secrets.GOTO_PERSONAL_ACCESS_TOKEN }}
          GOTO_ACCOUNT_KEY: ${{ secrets.GOTO_ACCOUNT_KEY }}
          GOTO_WEBHOOK_SECRET: ${{ secrets.GOTO_WEBHOOK_SECRET }}
        run: |
          args=(
            "OPENAI_API_KEY=$OPENAI_API_KEY"
            "OPENCODE_GO_API_KEY=$OPENCODE_GO_API_KEY"
            "QDRANT_API_KEY=$QDRANT_API_KEY"
            "TS_AUTHKEY=$TS_AUTHKEY"
            "POSTGRES_CONNECTION_STRING=$POSTGRES_CONNECTION_STRING"
            "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
            "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
            "CUSTSERVICE_SQL_PASSWORD=$CUSTSERVICE_SQL_PASSWORD"
          )
          if [ -n "$GRAFANA_CLOUD_INSTANCE_ID" ]; then
            args+=("GRAFANA_CLOUD_INSTANCE_ID=$GRAFANA_CLOUD_INSTANCE_ID")
            args+=("GRAFANA_CLOUD_API_TOKEN=$GRAFANA_CLOUD_API_TOKEN")
          fi
          # The app reads these as Chatwoot:BotToken and so on; the double underscore is the section.
          if [ -n "$CHATWOOT_BASE_URL" ]; then
            args+=("Chatwoot__BaseUrl=$CHATWOOT_BASE_URL")
            args+=("Chatwoot__AccountId=$CHATWOOT_ACCOUNT_ID")
            args+=("Chatwoot__InboxIdentifier=$CHATWOOT_INBOX_IDENTIFIER")
            args+=("Chatwoot__BotToken=$CHATWOOT_BOT_TOKEN")
          fi
          if [ -n "$CHATWOOT_SERVICE_TOKEN" ]; then args+=("Chatwoot__ServiceToken=$CHATWOOT_SERVICE_TOKEN"); fi
          if [ -n "$CHATWOOT_PLATFORM_TOKEN" ]; then
            args+=("Chatwoot__PlatformToken=$CHATWOOT_PLATFORM_TOKEN")
            args+=("Chatwoot__AdminToken=$CHATWOOT_APP_ADMIN_TOKEN")
            args+=("Chatwoot__InboxId=$CHATWOOT_INBOX_ID")
          fi
          if [ -n "$TWENTY_BASE_URL" ]; then
            args+=("Twenty__BaseUrl=$TWENTY_BASE_URL")
            args+=("Twenty__HubSecret=$TWENTY_HUB_SECRET")
          fi
          if [ -n "$GOTO_CLIENT_ID" ]; then
            args+=("Goto__ClientId=$GOTO_CLIENT_ID")
            args+=("Goto__ClientSecret=$GOTO_CLIENT_SECRET")
            args+=("Goto__PersonalAccessToken=$GOTO_PERSONAL_ACCESS_TOKEN")
            args+=("Goto__AccountKey=$GOTO_ACCOUNT_KEY")
            args+=("Goto__WebhookSecret=$GOTO_WEBHOOK_SECRET")
          fi
          flyctl secrets set --stage "${args[@]}"

      - name: Show what is set (names and digests only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl secrets list
