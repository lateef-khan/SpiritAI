name: Sync Fly secrets

# Manual only. fly.toml cannot declare required secrets the way a Render
# blueprint can, so this workflow is the CI equivalent of deploy-setup.sh:
# it copies GitHub repository secrets into the Fly secret store.
#
# Run it once before the first deploy, and again whenever a key is rotated.
# Everything else lives in fly.toml [env] and needs no secret at all.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  sync:
    name: Copy GitHub secrets into Fly
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check every required secret is present
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GRAFANA_CLOUD_INSTANCE_ID: ${{ secrets.GRAFANA_CLOUD_INSTANCE_ID }}
          GRAFANA_CLOUD_API_TOKEN: ${{ secrets.GRAFANA_CLOUD_API_TOKEN }}
        run: |
          missing=0
          # These six are load-bearing. config/spirit.yaml declares
          # `audit: { kind: postgres }`, `calls: { kind: postgres }` and
          # `blobs: { kind: s3 }`, and the host refuses to start without the
          # connection string or the S3 key pair rather than silently falling
          # back to in-memory stores. The AWS_* names are what AgentCore reads
          # for `s3-access-key-id` / `s3-secret-access-key`; Backblaze B2 calls
          # them keyID and applicationKey.
          for name in OPENAI_API_KEY QDRANT_API_KEY TS_AUTHKEY POSTGRES_CONNECTION_STRING AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set"
              missing=1
            fi
          done

          # Catch the single most common Tailscale mistake before it becomes a
          # crash-looping Machine: an API token instead of an auth key.
          case "$TS_AUTHKEY" in
            tskey-auth-*|"") ;;
            *) echo "::error::TS_AUTHKEY must start with 'tskey-auth-'. A 'tskey-api-' token is a different thing."; missing=1 ;;
          esac

          # Grafana is OPTIONAL, but the two halves are optional TOGETHER: naming
          # the instance id makes the token required, and a half-configured pair
          # stops the host at startup.
          if [ -n "$GRAFANA_CLOUD_INSTANCE_ID" ] && [ -z "$GRAFANA_CLOUD_API_TOKEN" ]; then
            echo "::error::GRAFANA_CLOUD_INSTANCE_ID is set but GRAFANA_CLOUD_API_TOKEN is not. Set both or neither."
            missing=1
          fi
          if [ -z "$GRAFANA_CLOUD_INSTANCE_ID" ]; then
            echo "::notice::Grafana Cloud not configured - telemetry export is off. That is fine."
          fi
          exit $missing

      # Creating the app here, and not through the Fly dashboard's "Launch from
      # GitHub" flow, is deliberate: that flow generates its own fly.toml,
      # Dockerfile and deploy workflow, all of which would fight the ones in this
      # repo and none of which know about Tailscale. This just makes an empty app
      # for our own fly.toml to deploy into.
      - name: Create the Fly app if it does not exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app="$(grep -m1 '^app *=' fly.toml | sed 's/.*= *"\(.*\)"/\1/')"
          echo "App: $app"
          if flyctl status --app "$app" >/dev/null 2>&1; then
            echo "Already exists."
          else
            flyctl apps create "$app" --org "${FLY_ORG:-personal}"
            echo "Created."
          fi

      - name: Stage secrets on Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GRAFANA_CLOUD_INSTANCE_ID: ${{ secrets.GRAFANA_CLOUD_INSTANCE_ID }}
          GRAFANA_CLOUD_API_TOKEN: ${{ secrets.GRAFANA_CLOUD_API_TOKEN }}
        run: |
          args=(
            "OPENAI_API_KEY=$OPENAI_API_KEY"
            "QDRANT_API_KEY=$QDRANT_API_KEY"
            "TS_AUTHKEY=$TS_AUTHKEY"
            "POSTGRES_CONNECTION_STRING=$POSTGRES_CONNECTION_STRING"
            "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
            "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
          )
          if [ -n "$GRAFANA_CLOUD_INSTANCE_ID" ]; then
            args+=("GRAFANA_CLOUD_INSTANCE_ID=$GRAFANA_CLOUD_INSTANCE_ID")
            args+=("GRAFANA_CLOUD_API_TOKEN=$GRAFANA_CLOUD_API_TOKEN")
          fi
          flyctl secrets set --stage "${args[@]}"

      - name: Show what is set (names and digests only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl secrets list
